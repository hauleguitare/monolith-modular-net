<div class="flex flex-col min-w-0 sm:h-full w-full">
    <!-- Header -->
    <div class="ml-2 text-3xl font-bold leading-none tracking-tight lg:ml-0">{{ 'nav.roleManagementOverview' | transloco }}</div>


    <!-- Content -->
    <div class="mt-8">
        <div class="w-full max-w-3xl">
            <div class="mat-elevation-z8">

                <div *ngIf="isLoading" class="absolute inset-0 flex items-center justify-center">
                    <mat-spinner diameter="36"></mat-spinner>
                </div>

                <table mat-table [dataSource]="dataSource">

                    <!-- Position Column -->
                    <ng-container matColumnDef="action">
                        <th mat-header-cell *matHeaderCellDef> Action </th>
                        <td mat-cell *matCellDef="let element">
                            <mat-menu #appMenu="matMenu">
                                <ng-template matMenuContent>
                                    <button [disabled]="!checkRolePriority(element.priority)" (click)="edit(element.id)" mat-menu-item>
                                        <mat-icon>edit</mat-icon>
                                        {{ 'action.edit' | transloco }}
                                    </button>
                                </ng-template>
                            </mat-menu>

                            <button mat-icon-button [matMenuTriggerFor]="appMenu">
                                <mat-icon>more_vert</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <!-- Position Column -->
                    <ng-container matColumnDef="position">
                        <th mat-header-cell *matHeaderCellDef> {{ 'col.no' | transloco }} </th>
                        <td mat-cell *matCellDef="let element"> {{element.position}} </td>
                    </ng-container>

                    <!-- Email Column -->
                    <ng-container matColumnDef="priority">
                        <th mat-header-cell *matHeaderCellDef> {{ 'col.priority' | transloco }} </th>
                        <td mat-cell *matCellDef="let element"> {{element.priority}} </td>
                    </ng-container>

                    <!-- Name Column -->
                    <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef> {{'col.name' | transloco }} </th>
                        <td mat-cell *matCellDef="let element"> {{element.name}} </td>
                    </ng-container>

                    <!-- Active Column -->
                    <ng-container matColumnDef="isDefault">
                        <th mat-header-cell *matHeaderCellDef> {{ 'col.isDefault' | transloco }} </th>
                        <td mat-cell *matCellDef="let element">
                            <mat-checkbox (click)="$event.preventDefault();" color="primary" [checked]="element.isDefault" [disableRipple]="true"></mat-checkbox>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>

                <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                               showFirstLastButtons
                               aria-label="Select page of periodic elements">
                </mat-paginator>
            </div>
        </div>
    </div>
</div>
